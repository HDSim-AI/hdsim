<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="A survey record becomes personas, then independent proposals, then a moderated negotiation, then the household decision">
<defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style></defs>
<rect x="0.0" y="22" width="156" height="104" rx="11" fill="#ffffff" stroke="#d9e2dd" stroke-width="1.5"/>
<text x="15.0" y="52" class="t" font-size="14" font-weight="650" fill="#17212b">Survey record</text>
<text x="15.0" y="78" class="t" font-size="12.5" fill="#5b6b78">one row per</text>
<text x="15.0" y="97" class="t" font-size="12.5" fill="#5b6b78">household member</text>
<rect x="186.0" y="22" width="156" height="104" rx="11" fill="#ffffff" stroke="#d9e2dd" stroke-width="1.5"/>
<text x="201.0" y="52" class="t" font-size="14" font-weight="650" fill="#17212b">Persona</text>
<text x="201.0" y="78" class="t" font-size="12.5" fill="#5b6b78">facts, then attitude,</text>
<text x="201.0" y="97" class="t" font-size="12.5" fill="#5b6b78">norm and control</text>
<path d="M162.0 74.0 h18" stroke="#b9c8c1" stroke-width="1.5" fill="none"/>
<path d="M176.0 70.0 l5 4 l-5 4" stroke="#b9c8c1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="372.0" y="22" width="156" height="104" rx="11" fill="#ffffff" stroke="#d9e2dd" stroke-width="1.5"/>
<text x="387.0" y="52" class="t" font-size="14" font-weight="650" fill="#17212b">Proposal</text>
<text x="387.0" y="78" class="t" font-size="12.5" fill="#5b6b78">every member alone,</text>
<text x="387.0" y="97" class="t" font-size="12.5" fill="#5b6b78">in parallel</text>
<path d="M348.0 74.0 h18" stroke="#b9c8c1" stroke-width="1.5" fill="none"/>
<path d="M362.0 70.0 l5 4 l-5 4" stroke="#b9c8c1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="558.0" y="22" width="156" height="104" rx="11" fill="#ffffff" stroke="#d9e2dd" stroke-width="1.5"/>
<text x="573.0" y="52" class="t" font-size="14" font-weight="650" fill="#17212b">Negotiation</text>
<text x="573.0" y="78" class="t" font-size="12.5" fill="#5b6b78">members correct</text>
<text x="573.0" y="97" class="t" font-size="12.5" fill="#5b6b78">each other, moderated</text>
<path d="M534.0 74.0 h18" stroke="#b9c8c1" stroke-width="1.5" fill="none"/>
<path d="M548.0 70.0 l5 4 l-5 4" stroke="#b9c8c1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="744.0" y="22" width="156" height="104" rx="11" fill="#e9f2ed" stroke="#2f7d5f" stroke-width="1.5"/>
<text x="759.0" y="52" class="t" font-size="14" font-weight="650" fill="#2f7d5f">Decision</text>
<text x="759.0" y="78" class="m" font-size="12.5" fill="#17212b">14 trips</text>
<text x="759.0" y="97" class="m" font-size="12.5" fill="#17212b">move: yes</text>
<path d="M720.0 74.0 h18" stroke="#b9c8c1" stroke-width="1.5" fill="none"/>
<path d="M734.0 70.0 l5 4 l-5 4" stroke="#b9c8c1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>